<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン | 無人販売支援システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon">🛒</div>
            <div>
                <h1>無人販売支援システム</h1>
                <p>農園ごとの管理画面にログイン</p>
            </div>
        </div>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            <label>
                農園名
                <input type="text" name="shop_name" placeholder="例：山田農園" required autocomplete="organization" />
            </label>
            <label>
                パスワード
                <input type="password" name="password" required autocomplete="current-password" />
            </label>
            <button type="submit" class="primary-button full-width">ログイン</button>
        </form>

        <p class="auth-link">初めて利用する場合は <a href="{{ url_for('register') }}">初回登録</a></p>
    </main>
</body>
</html>
